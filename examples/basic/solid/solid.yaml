experiment: examples
runno: 1
nthreads: 1

gsystem:
  - name: solid

g4camera:
  theta: 65*deg
  phi: 30*deg

# A single geantino is enough: Geant4 constructs (and overlap-checks) every solid
# at initialization regardless of where the beam goes, so this exercises the whole
# geometry while staying fast.
gparticle:
  - name: geantino
    p: 1000*MeV
    theta: 90*deg
    phi: 0*deg
