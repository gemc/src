# Uniform sphere centered at (2, -3, -300) mm; radius = sqrt(1^2 + 2^2 + 2^2) = 3 mm.
experiment: examples
runno: 1
nthreads: 1
recordZeroEdep: true
n: 5000
seed: 12345
show_field_lines: 0
show_auxiliary_edges: false

gsystem:
  - name: vertex_manipulation
    factory: ascii

gstreamer:
  - format: csv
    filename: sphere

phys_list: QBBC

g4camera:
  theta: 90*deg
  phi: 0*deg

gparticle:
  - name: geantino
    p: 1*GeV
    theta: 0*deg
    phi: 0*deg
    vx: 2*mm
    vy: -3*mm
    vz: -300*mm
    delta_vx: 1*mm
    delta_vy: 2*mm
    delta_vz: 2*mm
    randomVertexModel: sphere

# Flux true information carries the original track vertex in mm.
# One noninteracting primary per event gives one unbiased target hit per thrown vertex.
ganalysis_plots: 4
ganalysis_accumulate: true
ganalysis:
  - position: top_left
    plugin: flux
    source: "true"
    x: vx
    bins: 60
    x_min_auto: false
    x_max_auto: false
    x_min: -1.6
    x_max: 5.6
    title: "vx (mm): sphere marginal, center 2, R = 3 mm"
  - position: top_right
    plugin: flux
    source: "true"
    x: vy
    bins: 60
    x_min_auto: false
    x_max_auto: false
    x_min: -6.6
    x_max: 0.6
    title: "vy (mm): sphere marginal, center -3, R = 3 mm"
  - position: bottom_left
    plugin: flux
    source: "true"
    x: vz
    bins: 60
    x_min_auto: false
    x_max_auto: false
    x_min: -303.6
    x_max: -296.4
    title: "vz (mm): sphere marginal, center -300, R = 3 mm"
  - position: bottom_right
    plugin: flux
    source: "true"
    dimension: 2d
    x: vx
    y: vz
    bins: 40
    title: "Thrown vz versus vx (mm)"
