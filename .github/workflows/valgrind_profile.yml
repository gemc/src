name: Valgrind Profile

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}

# Profiles representative examples under callgrind. All profiling and reporting is done by the
# Callgrinder action (gemc/Callgrinder); this workflow only builds GEMC, generates each example's
# geometry, and hands the command to the action.

on:
  workflow_dispatch:
    inputs:
      events:
        description: Event count for every example (blank uses 100).
        required: false
        default: ''
        type: string
  workflow_run:
    workflows: [ "Test" ]
    types: [ completed ]
    branches: [ main ]

permissions:
  contents: read

concurrency:
  group: gemc-valgrind-profile-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

env:
  GEANT4_TAG: 11.4.2

jobs:
  profile:
    name: Profile ${{ matrix.example }}
    runs-on: ubuntu-latest
    timeout-minutes: 350
    # Debug-symbols image (Geant4 and CLHEP built RelWithDebInfo) so callgrind can name their routines.
    container: ghcr.io/gemc/g4install:11.4.2-ubuntu-26.04-debug
    strategy:
      fail-fast: false
      matrix:
        include:
          - example: basic/scintillator_barrel
            slug: basic-scintillator_barrel
            command: 'gemc scintillator_barrel.yaml -gsystem="[{name: scintillator_barrel, factory: ascii}]" -n={events} -nthreads=1'
          # torus ships as a field-display card with no beam; inject a muon beam so events traverse the field.
          - example: fields/torus
            slug: fields-torus
            command: 'gemc torus.yaml -gsystem="[{name: torus, factory: ascii}]" -gparticle="[{name: mu-, p: 2*GeV, theta: 20*deg, delta_phi: 360*deg, multiplicity: 6}]" -n={events} -nthreads=1'
          - example: optical/cherenkov
            slug: optical-cherenkov
            command: 'gemc cherenkov.yaml -gsystem="[{name: cherenkov, factory: ascii}]" -n={events} -nthreads=1'
          - example: optical/mirrors
            slug: optical-mirrors
            command: 'gemc mirrors.yaml -gsystem="[{name: mirrors, factory: ascii}]" -n={events} -nthreads=1'
          - example: advanced/sro
            slug: advanced-sro
            command: 'gemc sro.yaml -n={events} -nthreads=1'
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Install GEMC build dependencies
        run: python3 ci/build_packages.py --image ubuntu

      - name: Install Valgrind
        run: |
          apt-get update
          apt-get install -y valgrind

      - name: Build GEMC (profile build)
        env:
          GEMC_SKIP_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          module load geant4/"${GEANT4_TAG}"
          ./ci/build.sh profile

      - name: Prepare ${{ matrix.example }} geometry and environment
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          module load geant4/"${GEANT4_TAG}"
          install="${SIM_HOME}/gemc/dev"
          example="${{ matrix.example }}"
          name="${example##*/}"
          workdir="${RUNNER_TEMP}/prof-${{ matrix.slug }}"
          mkdir -p "${workdir}"
          cp -a "${install}/examples/${example}/." "${workdir}/"
          ( cd "${workdir}" && "${install}/python_env/bin/python3" "${name}.py" -f ascii )
          # Hand the profiled command (run by the Callgrinder action) the environment it needs.
          {
            env | grep -E '^G4[A-Z0-9_]*DATA='
            echo "LD_LIBRARY_PATH=${install}/lib:${LD_LIBRARY_PATH:-}"
            echo "PROFILE_WORKDIR=${workdir}"
          } >> "${GITHUB_ENV}"
          echo "${install}/bin" >> "${GITHUB_PATH}"

      - name: Profile ${{ matrix.example }}
        uses: gemc/Callgrinder@v1
        with:
          mode: profile
          name: ${{ matrix.example }}
          command: ${{ matrix.command }}
          events: ${{ github.event.inputs.events || '100' }}
          config: ci/callgrinder.json
          working-directory: ${{ env.PROFILE_WORKDIR }}
          output-dir: callgrinder-parts

      - name: Upload profile
        uses: actions/upload-artifact@v7
        with:
          name: callgrinder-${{ matrix.slug }}
          path: callgrinder-parts
          if-no-files-found: error
          retention-days: 30

  guidance:
    name: How to read the profiles
    needs: profile
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Download profiles
        uses: actions/download-artifact@v7
        with:
          pattern: callgrinder-*
          path: profiles

      - name: Aggregate the category tables and qcachegrind guidance
        uses: gemc/Callgrinder@v1
        with:
          mode: report
          input-dir: profiles

      - name: Gate on profile results
        if: needs.profile.result != 'success'
        run: |
          echo "### One or more profile jobs did not succeed." >> "$GITHUB_STEP_SUMMARY"
          exit 1
