# Build unprivileged PR previews; pr-docker-image-publish.yml publishes the OCI artifacts.
name: PR Docker Image

run-name: "PR #${{ github.event.pull_request.number }} image"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

concurrency:
  group: pr-docker-image-${{ github.event.pull_request.number }}
  cancel-in-progress: true

on:
  pull_request:
    types: [ opened, synchronize, reopened ]

jobs:
  resolve:
    name: Resolve build parameters
    runs-on: ubuntu-latest
    outputs:
      gemc_tag: ${{ steps.cfg.outputs.gemc_tag }}
      geant4_tag: ${{ steps.cfg.outputs.geant4_tag }}
      alma_tag: ${{ steps.cfg.outputs.alma_tag }}
      tag: ${{ steps.cfg.outputs.tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - id: cfg
        name: Resolve tags and latest AlmaLinux
        run: |
          source ci/tags_config.sh
          gemc_tag="$(get_gemc_tags | awk '{print $1}')"
          geant4_tag="$(get_geant4_tags | awk '{print $1}')"
          alma_tag="$(get_latest_almalinux)"
          tag="${gemc_tag}-almalinux-${alma_tag}-pr-${{ github.event.pull_request.number }}"
          {
            echo "gemc_tag=$gemc_tag"
            echo "geant4_tag=$geant4_tag"
            echo "alma_tag=$alma_tag"
            echo "tag=$tag"
          } >> "$GITHUB_OUTPUT"
          echo "Will build ${tag} (amd64 + arm64)"

  # Each architecture exports an OCI archive without registry credentials.
  build_arch:
    name: almalinux/${{ needs.resolve.outputs.alma_tag }} ${{ matrix.arch }}
    needs: resolve
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    env:
      DOCKER_BUILD_SUMMARY: false
      DOCKER_BUILD_RECORD_UPLOAD: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Free up disk space
        uses: ./.github/actions/free-disk-space
        with:
          prune_docker: "true"
          show_tree: "true"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate Dockerfile
        run: |
          python3 ci/dockerfile_creator.py \
            -i almalinux \
            -t "${{ needs.resolve.outputs.alma_tag }}" \
            --gemc-version "${{ needs.resolve.outputs.gemc_tag }}" \
            --geant4-version "${{ needs.resolve.outputs.geant4_tag }}" \
            --source context \
            --package-arch "${{ matrix.arch }}" \
            > Dockerfile.generated
          cat Dockerfile.generated

      - name: Build OCI archive
        uses: docker/build-push-action@v7
        with:
          pull: true
          no-cache: true
          context: .
          file: ./Dockerfile.generated
          target: final
          platforms: ${{ matrix.platform }}
          push: false
          outputs: type=oci,dest=${{ runner.temp }}/pr-image.tar
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.event.pull_request.head.sha }}

      - name: Upload OCI archive
        uses: actions/upload-artifact@v7
        with:
          name: pr-image-${{ matrix.arch }}
          path: ${{ runner.temp }}/pr-image.tar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
