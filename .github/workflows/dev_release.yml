name: Nightly Dev Release

on:
  schedule:
    - cron: '44 1 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: drelease-dev
  cancel-in-progress: false

jobs:
  dev-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Publish nightly prerelease
        uses: gemc/DRelease@v1
        with:
          tag: dev
          title: Dev Nightly
          ref: ${{ github.sha }}
          notes-path: ${{ runner.temp }}/dev-release-notes.md
