name: Thread Scaling

run-name: ${{ github.event.head_commit.message || github.event.pull_request.title || github.workflow }}

on:
  pull_request:
    paths-ignore:
      - "**/*.md"
  push:
    branches: [ main ]
    paths-ignore:
      - "**/*.md"
  schedule:
    - cron: "17 05 * * 1"
  release:
    types: [ published ]
  workflow_dispatch:
    inputs:
      profile:
        description: Benchmark duration and statistics.
        required: true
        default: statistical
        type: choice
        options:
          - quick
          - statistical
      strategy:
        description: ThreadScale measurement layout.
        required: true
        default: replicated-sweep
        type: choice
        options:
          - single-sweep
          - thread-sharded
          - replicated-sweep

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  GEANT4_TAG: 11.4.2

concurrency:
  group: gemc-thread-scaling-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  profile:
    name: Select benchmark profile
    runs-on: ubuntu-latest
    outputs:
      artifact-retention-days: ${{ steps.profile.outputs.artifact-retention-days }}
      benchmarks: ${{ steps.profile.outputs.benchmarks }}
      max-threads: ${{ steps.profile.outputs.max-threads }}
      replicas: ${{ steps.profile.outputs.replicas }}
      runs: ${{ steps.profile.outputs.runs }}
      strategy: ${{ steps.profile.outputs.strategy }}
      warmup-runs: ${{ steps.profile.outputs.warmup-runs }}
    steps:
      - id: profile
        name: Configure workload
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_PROFILE: ${{ inputs.profile }}
          REQUESTED_STRATEGY: ${{ inputs.strategy }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "push" ]]; then
            profile=quick
            strategy=single-sweep
          elif [[ "${EVENT_NAME}" == "schedule" || "${EVENT_NAME}" == "release" ]]; then
            profile=statistical
            strategy=replicated-sweep
          else
            profile="${REQUESTED_PROFILE}"
            strategy="${REQUESTED_STRATEGY}"
          fi

          if [[ "${profile}" == "quick" ]]; then
            runs=1
            warmup_runs=0
            replicas=1
            max_threads=4
            scintillator_events=1000
            cherenkov_events=100
            retention_days=7
          else
            runs=5
            warmup_runs=1
            replicas=4
            max_threads=0
            scintillator_events=50000
            cherenkov_events=500
            retention_days=30
          fi

          if [[ "${strategy}" != "replicated-sweep" ]]; then
            replicas=1
          fi

          {
            echo "strategy=${strategy}"
            echo "runs=${runs}"
            echo "warmup-runs=${warmup_runs}"
            echo "replicas=${replicas}"
            echo "max-threads=${max_threads}"
            echo "artifact-retention-days=${retention_days}"
          } >> "${GITHUB_OUTPUT}"

          python3 - "${scintillator_events}" "${cherenkov_events}" >> "${GITHUB_OUTPUT}" <<'PY'
          import json
          import sys

          scintillator_events, cherenkov_events = map(int, sys.argv[1:])

          def command(example: str, streamer: str) -> str:
              example_name = example.rsplit("/", maxsplit=1)[-1]
              return (
                  '"$RUNNER_TEMP/gemc/bin/gemc" '
                  f'"$RUNNER_TEMP/gemc/examples/{example}/{example_name}.yaml" '
                  '"-sql=$RUNNER_TEMP/gemc/examples/gemc.db" '
                  f"-n={{workload}} -nthreads={{threads}} -seed=12345 '{streamer}'"
              )

          def definitions(example: str, workload: int) -> list[dict[str, object]]:
              example_name = example.rsplit("/", maxsplit=1)[-1]
              comparison_group = f"{example} output comparison"
              return [
                  {
                      "name": f"{example}: no output",
                      "command": command(example, "-gstreamer=[]"),
                      "working_directory": ".",
                      "workload": workload,
                      "workload_unit": "events",
                      "comparison_group": comparison_group,
                      "comparison_label": "No output",
                  },
                  {
                      "name": f"{example}: ROOT output",
                      "command": command(
                          example,
                          f"-gstreamer=[{{format: root, filename: {example_name}}}]",
                      ),
                      "working_directory": ".",
                      "workload": workload,
                      "workload_unit": "events",
                      "comparison_group": comparison_group,
                      "comparison_label": "ROOT output",
                  },
              ]

          benchmarks = [
              *definitions("basic/scintillator_barrel", scintillator_events),
              *definitions("optical/cherenkov", cherenkov_events),
          ]
          print(f"benchmarks={json.dumps(benchmarks, separators=(',', ':'))}")
          PY

  build:
    name: Build benchmark installation
    needs: [ profile ]
    runs-on: ubuntu-latest
    timeout-minutes: 180
    container: ghcr.io/gemc/g4install:11.4.2-ubuntu-24.04
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}
          fetch-depth: 0

      - name: Install GEMC build dependencies
        run: python3 ci/build_packages.py --image ubuntu

      - name: Build optimized GEMC installation
        env:
          GEMC_SKIP_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          module load geant4/"${GEANT4_TAG}"
          ./ci/build.sh

      - name: Package benchmark installation
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          module load geant4/"${GEANT4_TAG}"
          mkdir -p thread-scaling-install
          GEANT4_VERSION="${GEANT4_TAG}" GEMC_PACKAGE_VERSION=thread-scaling \
            ci/package_install.sh \
              "${SIM_HOME}/gemc/dev" \
              thread-scaling-install \
              gemc-thread-scaling

      - name: Upload benchmark installation
        uses: actions/upload-artifact@v7
        with:
          name: gemc-thread-scaling-install
          path: thread-scaling-install/*.tar.gz
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.profile.outputs.artifact-retention-days) }}

  benchmark:
    name: Measure and plot scaling
    needs: [ profile, build ]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    # ThreadScale runs on an already deployed GEMC image containing all required runtime packages.
    container: ghcr.io/gemc/src:dev-ubuntu-24.04
    steps:
      - name: Checkout benchmark source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name || github.sha }}

      - name: Checkout ThreadScale command
        uses: actions/checkout@v6
        with:
          repository: gemc/ThreadScale
          # Comparison groups are on development; use main until the next versioned release.
          ref: main
          path: threadscale

      - name: Select Node.js for ThreadScale
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Download benchmark installation
        uses: actions/download-artifact@v7
        with:
          name: gemc-thread-scaling-install
          path: thread-scaling-install

      - name: Extract benchmark installation
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(thread-scaling-install/*.tar.gz)
          shopt -u nullglob
          if (( ${#tarballs[@]} != 1 )); then
            echo "Expected one benchmark tarball, found ${#tarballs[@]}" >&2
            exit 1
          fi
          mkdir -p "${RUNNER_TEMP}/gemc"
          tar -xzf "${tarballs[0]}" -C "${RUNNER_TEMP}/gemc" --strip-components=1

      - name: Measure thread scaling
        env:
          BENCHMARKS_JSON: ${{ needs.profile.outputs.benchmarks }}
          MAX_THREADS: ${{ needs.profile.outputs.max-threads }}
          REPLICAS: ${{ needs.profile.outputs.replicas }}
          RUNS: ${{ needs.profile.outputs.runs }}
          STRATEGY: ${{ needs.profile.outputs.strategy }}
          WARMUP_RUNS: ${{ needs.profile.outputs.warmup-runs }}
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_ENTRYPOINT_SOURCE_ONLY=1
          . /usr/local/bin/docker-entrypoint.sh
          module load geant4/"${GEANT4_TAG}"
          export PATH="${RUNNER_TEMP}/gemc/bin:${PATH}"
          export LD_LIBRARY_PATH="${RUNNER_TEMP}/gemc/lib:${LD_LIBRARY_PATH:-}"

          "${RUNNER_TEMP}/gemc/bin/gemc" -v

          benchmarks_file="${RUNNER_TEMP}/threadscale-benchmarks.json"
          printf '%s\n' "${BENCHMARKS_JSON}" > "${benchmarks_file}"

          ./threadscale/test_scaling \
            --benchmarks "${benchmarks_file}" \
            --threads powers-of-two \
            --max-threads "${MAX_THREADS}" \
            --duration 0 \
            --runs "${RUNS}" \
            --warmup-runs "${WARMUP_RUNS}" \
            --strategy "${STRATEGY}" \
            --replicas "${REPLICAS}" \
            --timeout-seconds 900 \
            --output-dir thread-scaling \
            --summary-plots rate

          summary_file="$(python3 ci/name_thread_scaling_summary.py thread-scaling)"
          cat "${summary_file}" >> "${GITHUB_STEP_SUMMARY}"
          echo "Machine-specific Markdown report: ${summary_file}"

      - name: Upload scaling report
        uses: actions/upload-artifact@v7
        with:
          name: thread-scaling-report
          path: thread-scaling
          if-no-files-found: error
          retention-days: ${{ fromJSON(needs.profile.outputs.artifact-retention-days) }}
